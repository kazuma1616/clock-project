<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>警鐘長鳴</title>
  <!-- 載入 Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- 載入 Google Fonts 繁體中文思源宋體與黑體 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;900&display=swap" rel="stylesheet">
  
  <style>
    body {
      font-family: 'Noto Sans TC', sans-serif;
      background-color: #09090b;
      color: #f4f4f5;
      overflow-x: hidden;
    }

    .font-serif-tc {
      font-family: 'Noto Serif TC', serif;
    }

    /* 鐘體擺動動畫 */
    @keyframes bellSwing {
      0% { transform: rotate(0deg); }
      15% { transform: rotate(14deg); }
      30% { transform: rotate(-12deg); }
      45% { transform: rotate(9deg); }
      60% { transform: rotate(-6deg); }
      75% { transform: rotate(3deg); }
      90% { transform: rotate(-1.5deg); }
      100% { transform: rotate(0deg); }
    }

    /* 鐘舌擺動動畫（略微延遲以產生真實撞擊感） */
    @keyframes clapperSwing {
      0% { transform: rotate(0deg); }
      12% { transform: rotate(-18deg); }
      28% { transform: rotate(16deg); }
      44% { transform: rotate(-12deg); }
      58% { transform: rotate(8deg); }
      74% { transform: rotate(-4deg); }
      88% { transform: rotate(2deg); }
      100% { transform: rotate(0deg); }
    }

    /* 聲波擴散波紋動畫 */
    @keyframes rippleWave {
      0% {
        transform: scale(0.85);
        opacity: 0.75;
        border-width: 2px;
      }
      100% {
        transform: scale(2.4);
        opacity: 0;
        border-width: 1px;
      }
    }

    .animate-bell {
      transform-origin: 100px 28px;
      animation: bellSwing 1.6s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }

    .animate-clapper {
      transform-origin: 100px 135px;
      animation: clapperSwing 1.6s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }

    .ripple-ring {
      position: absolute;
      inset: 0;
      border-radius: 9999px;
      border: 2px solid rgba(239, 68, 68, 0.6);
      pointer-events: none;
      animation: rippleWave 2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    /* 背景微弱警戒光暈 */
    .ambient-glow {
      background: radial-gradient(circle at center, rgba(220, 38, 38, 0.14) 0%, rgba(9, 9, 11, 0) 68%);
      transition: opacity 0.6s ease;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-between p-6 select-none relative">

  <!-- 背景動態光暈 -->
  <div id="ambientGlow" class="ambient-glow fixed inset-0 pointer-events-none opacity-30"></div>

  <!-- 頂部狀態列 -->
  <header class="w-full max-w-md flex items-center justify-between pt-2 z-10">
    <div class="flex items-center gap-2.5 px-3.5 py-1.5 rounded-full bg-zinc-900/90 border border-zinc-800 shadow-sm">
      <span id="statusDot" class="w-2.5 h-2.5 rounded-full bg-zinc-600 transition-colors duration-300"></span>
      <span id="statusText" class="text-xs font-medium tracking-wider text-zinc-400">待命狀態</span>
    </div>
    <span class="text-xs tracking-widest text-zinc-500 font-mono">ALARM BELL</span>
  </header>

  <!-- 中央主視覺區塊 -->
  <main class="flex flex-col items-center justify-center my-auto z-10 w-full max-w-md text-center">
    
    <!-- 警鐘與波紋容器 -->
    <div id="bellStage" class="relative w-56 h-56 sm:w-64 sm:h-64 flex items-center justify-center mb-8 cursor-pointer group" title="點擊直接敲響警鐘">
      <!-- 動態聲波波紋將插入此處 -->
      <div id="rippleContainer" class="absolute inset-4 rounded-full pointer-events-none"></div>

      <!-- 內圈裝飾環 -->
      <div class="absolute inset-6 rounded-full border border-zinc-800/80 bg-zinc-900/40 backdrop-blur-sm group-hover:border-red-900/50 transition-colors duration-300"></div>

      <!-- 精緻金屬警鐘 SVG -->
      <svg viewBox="0 0 200 200" class="w-44 h-44 sm:w-48 sm:h-48 relative z-10 drop-shadow-[0_12px_24px_rgba(0,0,0,0.85)]">
        <defs>
          <!-- 銅金色/警示紅金屬漸層 -->
          <linearGradient id="bellMetal" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#fca5a5" />
            <stop offset="25%" stop-color="#ef4444" />
            <stop offset="65%" stop-color="#991b1b" />
            <stop offset="100%" stop-color="#450a0a" />
          </linearGradient>
          <linearGradient id="bellHighlight" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="rgba(255,255,255,0)" />
            <stop offset="45%" stop-color="rgba(255,255,255,0.28)" />
            <stop offset="60%" stop-color="rgba(255,255,255,0.05)" />
            <stop offset="100%" stop-color="rgba(255,255,255,0)" />
          </linearGradient>
          <radialGradient id="clapperGrad" cx="40%" cy="40%" r="60%">
            <stop offset="0%" stop-color="#fde047" />
            <stop offset="60%" stop-color="#ca8a04" />
            <stop offset="100%" stop-color="#713f12" />
          </radialGradient>
        </defs>

        <!-- 頂部懸掛支架 -->
        <rect x="76" y="14" width="48" height="8" rx="4" fill="#3f3f46" />
        <circle cx="100" cy="26" r="7" fill="none" stroke="#71717a" stroke-width="4" />

        <!-- 擺動群組：鐘體與鐘舌 -->
        <g id="bellGroup">
          <!-- 鐘舌 (Clapper) -->
          <g id="clapperGroup">
            <line x1="100" y1="130" x2="100" y2="164" stroke="#a1a1aa" stroke-width="4" stroke-linecap="round" />
            <circle cx="100" cy="166" r="11" fill="url(#clapperGrad)" />
          </g>

          <!-- 鐘體主輪廓 -->
          <path d="M 100 32 
                   C 72 32, 56 52, 52 84 
                   C 48 114, 38 134, 26 146 
                   C 22 150, 25 156, 31 156 
                   L 169 156 
                   C 175 156, 178 150, 174 146 
                   C 162 134, 152 114, 148 84 
                   C 144 52, 128 32, 100 32 Z" 
                fill="url(#bellMetal)" />

          <!-- 鐘體高光反光層 -->
          <path d="M 100 32 
                   C 72 32, 56 52, 52 84 
                   C 48 114, 38 134, 26 146 
                   C 22 150, 25 156, 31 156 
                   L 169 156 
                   C 175 156, 178 150, 174 146 
                   C 162 134, 152 114, 148 84 
                   C 144 52, 128 32, 100 32 Z" 
                fill="url(#bellHighlight)" />

          <!-- 鐘身裝飾刻紋 -->
          <path d="M 48 128 Q 100 134 152 128" fill="none" stroke="rgba(0,0,0,0.35)" stroke-width="2.5" />
          <path d="M 55 76 Q 100 80 145 76" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="1.5" />
          
          <!-- 鐘口厚實邊緣 -->
          <rect x="25" y="148" width="150" height="8" rx="4" fill="#7f1d1d" />
        </g>
      </svg>
    </div>

    <!-- 主標題與副標語 -->
    <h1 class="font-serif-tc text-4xl sm:text-5xl font-black tracking-[0.25em] text-zinc-100 mb-3 pl-[0.25em]">
      警鐘長鳴
    </h1>
    <p class="text-sm sm:text-base text-zinc-400 tracking-widest mb-8">
      居安思危 · 戒慎恐懼 · 時刻警醒
    </p>

    <!-- 控制面板卡片 -->
    <div class="w-full bg-zinc-900/80 border border-zinc-800/90 rounded-2xl p-5 backdrop-blur-md shadow-2xl space-y-4">
      
      <!-- 主要開關按鈕：敲響警鐘 / 停止鳴響 -->
      <button id="toggleBtn" type="button" class="w-full py-3.5 px-6 rounded-xl font-bold text-base tracking-wider transition-all duration-200 flex items-center justify-center gap-2.5 bg-red-600 hover:bg-red-500 active:scale-[0.98] text-white shadow-lg shadow-red-950/50 cursor-pointer">
        <svg id="btnIconPlay" class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M14.857 17.082a23.848 23.848 0 005.454-1.31A8.967 8.967 0 0118 9.75v-.7V9A6 6 0 006 9v.75a8.967 8.967 0 01-2.312 6.022c1.733.64 3.56 1.085 5.455 1.31m5.714 0a24.255 24.255 0 01-5.714 0m5.714 0a3 3 0 11-5.714 0" />
        </svg>
        <svg id="btnIconStop" class="w-5 h-5 hidden" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 10a1 1 0 011-1h4a1 1 0 011 1v4a1 1 0 01-1 1h-4a1 1 0 01-1-1v-4z" />
        </svg>
        <span id="toggleBtnText">敲響警鐘</span>
      </button>

      <!-- 次要控制項：鳴響頻率切換 與 手動單次敲響 -->
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 pt-1">
        <!-- 頻率切換分段按鈕 -->
        <div class="flex rounded-xl bg-zinc-950 p-1 border border-zinc-800" role="group" aria-label="鳴響頻率">
          <button id="modeSlow" type="button" class="flex-1 py-2 px-2 rounded-lg text-xs font-medium tracking-wider transition-colors text-zinc-400 hover:text-zinc-200 cursor-pointer">
            慢速沉穩
          </button>
          <button id="modeFast" type="button" class="flex-1 py-2 px-2 rounded-lg text-xs font-medium tracking-wider transition-colors bg-red-950/80 text-red-200 border border-red-800/50 shadow-sm cursor-pointer">
            急促警告
          </button>
        </div>

        <!-- 手動敲響一次 -->
        <button id="singleStrikeBtn" type="button" class="py-2.5 px-4 rounded-xl text-xs font-medium tracking-wider bg-zinc-800/80 hover:bg-zinc-700/80 active:scale-[0.98] text-zinc-200 border border-zinc-700/80 transition-all flex items-center justify-center gap-1.5 cursor-pointer">
          <svg class="w-4 h-4 text-amber-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z" />
          </svg>
          <span>手動敲響一次</span>
        </button>
      </div>

    </div>
  </main>

  <!-- 底部計數與提示 -->
  <footer class="w-full max-w-md text-center pb-2 z-10">
    <p class="text-xs text-zinc-500">
      已累計鳴響 <span id="strikeCount" class="text-zinc-300 font-mono font-semibold">0</span> 次 · 內建 Web Audio 金屬鐘聲合成
    </p>
  </footer>

  <script>
    /**
     * 警鐘長鳴核心邏輯
     * 包含 Web Audio API 金屬泛音合成器、視覺波紋與擺動控制
     */
    (function () {
      // 狀態變數
      let audioCtx = null;
      let isRinging = false;
      let ringTimer = null;
      let ringIntervalMs = 700; // 預設急促警告 (0.7秒)
      let strikeCounter = 0;

      // DOM 元素參照
      const toggleBtn = document.getElementById('toggleBtn');
      const toggleBtnText = document.getElementById('toggleBtnText');
      const btnIconPlay = document.getElementById('btnIconPlay');
      const btnIconStop = document.getElementById('btnIconStop');
      const modeSlowBtn = document.getElementById('modeSlow');
      const modeFastBtn = document.getElementById('modeFast');
      const singleStrikeBtn = document.getElementById('singleStrikeBtn');
      const bellStage = document.getElementById('bellStage');
      const bellGroup = document.getElementById('bellGroup');
      const clapperGroup = document.getElementById('clapperGroup');
      const rippleContainer = document.getElementById('rippleContainer');
      const statusDot = document.getElementById('statusDot');
      const statusText = document.getElementById('statusText');
      const ambientGlow = document.getElementById('ambientGlow');
      const strikeCountEl = document.getElementById('strikeCount');

      /**
       * 初始化或恢復 Web Audio Context（符合瀏覽器自動播放安全策略）
       */
      function ensureAudioContext() {
        try {
          if (!audioCtx) {
            const AudioContextClass = window.AudioContext || window.webkitAudioContext;
            audioCtx = new AudioContextClass();
          }
          if (audioCtx.state === 'suspended') {
            audioCtx.resume();
          }
        } catch (err) {
          console.error('Web Audio API 初始化失敗:', err);
        }
      }

      /**
       * 使用加法合成 (Additive Synthesis) 模擬真實青銅/鑄鐵警鐘的金屬共鳴聲
       * 透過非整數倍泛音頻率與不同衰減時間營造厚實且具穿透力的鐘鳴
       */
      function playMetallicBellSound() {
        ensureAudioContext();
        if (!audioCtx) return;

        const now = audioCtx.currentTime;

        // 主輸出增益控制，避免連續敲擊破音
        const masterGain = audioCtx.createGain();
        masterGain.gain.setValueAtTime(0.65, now);
        masterGain.connect(audioCtx.destination);

        // 金屬鐘聲泛音結構：[頻率(Hz), 初始音量, 衰減秒數, 波形]
        const partials = [
          { freq: 330.0,  gain: 0.45, decay: 3.2, type: 'sine' },     // 基頻 (E4) 沉穩共鳴
          { freq: 659.25, gain: 0.30, decay: 2.4, type: 'sine' },     // 八度泛音
          { freq: 785.0,  gain: 0.25, decay: 1.9, type: 'triangle' }, // 非整數金屬泛音 (產生鐘聲特色)
          { freq: 1174.6, gain: 0.18, decay: 1.4, type: 'sine' },     // 高頻清脆泛音
          { freq: 1762.0, gain: 0.12, decay: 0.8, type: 'sine' },     // 撞擊瞬間金屬光澤
          { freq: 2489.0, gain: 0.08, decay: 0.35, type: 'sine' }     // 鐘舌敲擊瞬間高頻瞬態
        ];

        partials.forEach((p) => {
          const osc = audioCtx.createOscillator();
          const gainNode = audioCtx.createGain();

          osc.type = p.type;
          // 加入極微小的頻率偏移模擬真實鑄造不對稱拍頻 (Beating effect)
          osc.frequency.setValueAtTime(p.freq, now);

          // 音量包絡線：極短起音 (Attack) + 指數自然衰減 (Decay)
          gainNode.gain.setValueAtTime(0.0001, now);
          gainNode.gain.linearRampToValueAtTime(p.gain, now + 0.008);
          gainNode.gain.exponentialRampToValueAtTime(0.0001, now + p.decay);

          osc.connect(gainNode);
          gainNode.connect(masterGain);

          osc.start(now);
          osc.stop(now + p.decay + 0.05);
        });
      }

      /**
       * 觸發單次視覺與聽覺敲鐘效果
       */
      function triggerBellStrike() {
        // 1. 播放金屬鐘聲
        playMetallicBellSound();

        // 2. 更新計數器
        strikeCounter += 1;
        strikeCountEl.textContent = strikeCounter;

        // 3. 重新觸發鐘體與鐘舌擺動動畫
        bellGroup.classList.remove('animate-bell');
        clapperGroup.classList.remove('animate-clapper');
        // 強制瀏覽器重繪 (Reflow) 以重置 CSS Animation
        void bellGroup.offsetWidth;
        bellGroup.classList.add('animate-bell');
        clapperGroup.classList.add('animate-clapper');

        // 4. 產生擴散聲波波紋
        createRippleWave();
      }

      /**
       * 在警鐘周圍生成擴散的紅色警示波紋
       */
      function createRippleWave() {
        const ring = document.createElement('div');
        ring.className = 'ripple-ring';
        rippleContainer.appendChild(ring);

        // 動畫結束後自動移除 DOM 元素，保持效能潔淨
        ring.addEventListener('animationend', () => {
          ring.remove();
        });
      }

      /**
       * 啟動持續鳴響模式
       */
      function startContinuousRinging() {
        if (isRinging) return;
        isRinging = true;

        // 更新按鈕外觀為「停止鳴響」
        toggleBtnText.textContent = '停止鳴響';
        toggleBtn.classList.remove('bg-red-600', 'hover:bg-red-500', 'shadow-red-950/50');
        toggleBtn.classList.add('bg-zinc-700', 'hover:bg-zinc-600', 'shadow-zinc-950/50');
        btnIconPlay.classList.add('hidden');
        btnIconStop.classList.remove('hidden');

        // 更新狀態列與背景光暈
        statusDot.classList.remove('bg-zinc-600');
        statusDot.classList.add('bg-red-500', 'animate-ping');
        statusText.textContent = '警鐘長鳴中';
        statusText.classList.remove('text-zinc-400');
        statusText.classList.add('text-red-400');
        ambientGlow.classList.remove('opacity-30');
        ambientGlow.classList.add('opacity-100');

        // 立即敲響第一聲，並設定週期定時器
        triggerBellStrike();
        ringTimer = setInterval(triggerBellStrike, ringIntervalMs);
      }

      /**
       * 停止持續鳴響模式
       */
      function stopContinuousRinging() {
        if (!isRinging) return;
        isRinging = false;

        clearInterval(ringTimer);
        ringTimer = null;

        // 恢復按鈕外觀為「敲響警鐘」
        toggleBtnText.textContent = '敲響警鐘';
        toggleBtn.classList.remove('bg-zinc-700', 'hover:bg-zinc-600', 'shadow-zinc-950/50');
        toggleBtn.classList.add('bg-red-600', 'hover:bg-red-500', 'shadow-red-950/50');
        btnIconStop.classList.add('hidden');
        btnIconPlay.classList.remove('hidden');

        // 更新狀態列與背景光暈
        statusDot.classList.remove('bg-red-500', 'animate-ping');
        statusDot.classList.add('bg-zinc-600');
        statusText.textContent = '已暫停鳴響';
        statusText.classList.remove('text-red-400');
        statusText.classList.add('text-zinc-400');
        ambientGlow.classList.remove('opacity-100');
        ambientGlow.classList.add('opacity-30');
      }

      /**
       * 切換鳴響頻率（慢速沉穩 vs 急促警告）
       */
      function setFrequencyMode(mode) {
        if (mode === 'slow') {
          ringIntervalMs = 2400;
          modeSlowBtn.className = 'flex-1 py-2 px-2 rounded-lg text-xs font-medium tracking-wider transition-colors bg-zinc-800 text-zinc-100 shadow-sm cursor-pointer';
          modeFastBtn.className = 'flex-1 py-2 px-2 rounded-lg text-xs font-medium tracking-wider transition-colors text-zinc-400 hover:text-zinc-200 cursor-pointer';
        } else {
          ringIntervalMs = 700;
          modeFastBtn.className = 'flex-1 py-2 px-2 rounded-lg text-xs font-medium tracking-wider transition-colors bg-red-950/80 text-red-200 border border-red-800/50 shadow-sm cursor-pointer';
          modeSlowBtn.className = 'flex-1 py-2 px-2 rounded-lg text-xs font-medium tracking-wider transition-colors text-zinc-400 hover:text-zinc-200 cursor-pointer';
        }

        // 若正在長鳴中，立即套用新頻率
        if (isRinging) {
          clearInterval(ringTimer);
          triggerBellStrike();
          ringTimer = setInterval(triggerBellStrike, ringIntervalMs);
        }
      }

      // 事件監聽綁定
      toggleBtn.addEventListener('click', () => {
        if (isRinging) {
          stopContinuousRinging();
        } else {
          startContinuousRinging();
        }
      });

      singleStrikeBtn.addEventListener('click', () => {
        triggerBellStrike();
      });

      bellStage.addEventListener('click', () => {
        triggerBellStrike();
      });

      modeSlowBtn.addEventListener('click', () => setFrequencyMode('slow'));
      modeFastBtn.addEventListener('click', () => setFrequencyMode('fast'));

      // 支援空白鍵快捷切換開啟/停止
      document.addEventListener('keydown', (e) => {
        if (e.code === 'Space' && document.activeElement.tagName !== 'BUTTON') {
          e.preventDefault();
          toggleBtn.click();
        }
      });
    })();
  </script>
</body>
</html>
